<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tindahan ning Kultura</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Georgia,"Trebuchet MS",serif;color:#3b2412;background:repeating-linear-gradient(0deg,transparent 0 58px,rgba(120,90,50,.13) 58px 60px),repeating-linear-gradient(90deg,transparent 0 98px,rgba(120,90,50,.1) 98px 100px),#f4ead2;display:flex;flex-direction:column;align-items:center;text-align:center}
.store{width:min(920px,100%);padding:0 8px}
.roof{position:relative;height:50px;margin-top:10px;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,#5f656b 0 14px,#868d94 14px 22px,#5f656b 22px 36px)}
.roof::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:radial-gradient(circle at 12px 0,#5f656b 11px,transparent 12px) 0 0/24px 12px repeat-x}
.board{margin:22px auto 0;width:min(780px,96%);background:#c8102e;border:4px solid #7a0a1c;border-radius:10px;padding:10px 12px 12px;color:#fff6d6;box-shadow:0 5px 0 #7a0a1c}
.board small{letter-spacing:3px;font-size:.85rem}
.plaque{background:#f7f0dc;border:3px solid #e2d6b2;border-radius:6px;color:#2c2a26;margin-top:6px;padding:8px 12px}
.plaque h1{margin:0;font-size:clamp(1.5rem,6.5vw,2.8rem)}
.plaque p{margin:2px 0 0;font-size:clamp(.85rem,2.8vw,1.1rem)}
.awning{height:42px;margin-top:16px;border-radius:6px 6px 14px 14px;border-bottom:6px solid #7a0a1c;background:repeating-linear-gradient(90deg,#c8102e 0 28px,#fff6d6 28px 56px,#1f8a8a 56px 84px,#fff6d6 84px 112px)}
.hang{position:relative;z-index:2;display:flex;justify-content:space-around;align-items:flex-start;height:76px;padding:0 4%;margin-bottom:-34px}
.sachet{position:relative;margin-top:18px;width:clamp(22px,5vw,34px);height:clamp(36px,8vw,52px);background:var(--c);border-radius:3px 3px 8px 8px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);transform-origin:50% -18px;animation:sway 3s ease-in-out infinite alternate}
.sachet::before{content:"";position:absolute;left:50%;top:-18px;width:2px;height:18px;background:#5b3a1a}
.ban{margin-top:4px;font-size:clamp(1.6rem,5vw,2.4rem);transform-origin:top;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.win{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#f5c96a;border:6px solid #e9b04a;border-radius:8px;padding:40px 8px 8px;margin:0 auto 38px;width:min(780px,96%)}
.pane{position:relative;min-height:clamp(96px,20vw,150px);background:#4a3020;border-radius:4px;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;font-size:clamp(1.2rem,4.6vw,2.2rem)}
.pane::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(40,25,10,.55) 0 2px,transparent 2px 14px),repeating-linear-gradient(90deg,rgba(40,25,10,.55) 0 2px,transparent 2px 14px)}
.utang{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%) rotate(-2deg);background:#fffaf0;border:3px solid #d8c9a6;border-radius:6px;padding:4px 14px;font-weight:bold;font-size:clamp(.9rem,3.4vw,1.3rem);box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap;z-index:3}
.dot{position:absolute;left:-10px;z-index:3;width:clamp(50px,11vw,68px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:bold;font-size:.75rem;line-height:1.1;border:3px solid #fff6d6;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.dot.a{top:44px;background:#1d6fa5}.dot.b{top:calc(50px + clamp(54px,12vw,72px));background:#d99a1b}
main{width:100%;padding:8px 8px 0}
.bubble{position:relative;display:inline-block;background:#6b6f73;color:#fff;font-weight:bold;border-radius:18px;padding:8px 20px;font-size:clamp(1rem,3.8vw,1.35rem);margin-bottom:18px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#6b6f73;border-bottom:0}
.scene{width:min(680px,94vw);margin:0 auto;perspective:1400px;transition:transform .25s}
.scene:hover{transform:translateY(-5px) rotate(-.5deg)}
.scene.deal{animation:deal .6s cubic-bezier(.2,.8,.3,1.25)}
.card{display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.4,1);cursor:pointer;border-radius:24px;outline-offset:6px}
.card:focus-visible{outline:3px solid #0b57d0}
.card.flipped{transform:rotateY(180deg)}
.face{position:relative;grid-area:1/1;min-height:clamp(300px,52vw,380px);backface-visibility:hidden;-webkit-backface-visibility:hidden;border:5px solid #8a5a2b;border-radius:24px;box-shadow:0 9px 0 #5b3a1a,0 16px 22px rgba(0,0,0,.28);padding:34px 22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.back{background:repeating-linear-gradient(45deg,#c8102e 0 22px,#fff6d6 22px 44px,#1f8a8a 44px 66px,#fff6d6 66px 88px);color:#fff}
.back b{display:grid;place-items:center;width:clamp(90px,22vw,130px);aspect-ratio:1;border-radius:50%;background:#ffd23f;color:#7a0a1c;font-size:clamp(3.4rem,12vw,5.5rem);border:5px solid #7a0a1c;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.back span{background:#7a0a1c;padding:6px 20px;border-radius:999px;font-weight:bold;letter-spacing:2px;font-size:clamp(1rem,3.6vw,1.4rem)}
.front{transform:rotateY(180deg);background:#fffaf0;visibility:hidden;transition:visibility 0s .35s}
.flipped .front{visibility:visible;transition-delay:0s}
.price{position:absolute;top:12px;right:14px;background:#ffd23f;color:#7a0a1c;font-weight:bold;padding:2px 12px;border-radius:4px;transform:rotate(6deg);font-size:.95rem;border:2px dashed #7a0a1c}
.cat{padding:7px 22px;border-radius:999px;font-weight:bold;letter-spacing:2px;font-size:clamp(.9rem,3.2vw,1.1rem);color:#fff;border:2px dashed #fff6d6}
.cat.tt{background:#0b7a4b}.cat.tv{background:#b8460e}
.q{font-size:clamp(1.4rem,5.4vw,2.3rem);font-weight:bold;line-height:1.3;overflow-wrap:anywhere}
.a{display:none;background:#ffe9a8;border-left:6px solid #c8102e;border-radius:10px;padding:12px 16px;font-size:clamp(1.1rem,3.8vw,1.5rem);overflow-wrap:anywhere}
.a.show{display:block;animation:pop .45s cubic-bezier(.2,.8,.3,1.3)}
.a small{display:block;font-size:.7rem;letter-spacing:1px;color:#7a0a1c;font-weight:bold}
button{font:inherit;font-weight:bold;cursor:pointer;border-radius:12px;border:3px solid #3b2412}
button:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}
#reveal{background:#fff6d6;color:#3b2412;padding:10px 22px;font-size:1.1rem}
#shuffle{display:block;margin:30px auto 32px;width:min(440px,90vw);padding:16px;font-size:clamp(1.3rem,5vw,1.8rem);letter-spacing:3px;color:#fff6d6;background:#c8102e;box-shadow:0 7px 0 #7a0a1c}
#shuffle:hover{filter:brightness(1.1)}
#shuffle:active{transform:translateY(5px);box-shadow:0 2px 0 #7a0a1c}
#shuffle.spin span{display:inline-block;animation:spin .5s}
.counter{width:min(920px,100%);margin-top:auto;background:#8a5a2b;box-shadow:inset 0 10px 0 #a8743c;border-radius:10px 10px 0 0;padding:24px 10px 12px;display:flex;flex-wrap:wrap;justify-content:space-around;font-size:clamp(1.8rem,6.5vw,2.8rem);color:#fff6d6}
.counter p{flex-basis:100%;margin:10px 0 0;font-size:.9rem}
@keyframes deal{0%{transform:translateY(-50px) rotate(-8deg) scale(.85);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="store">
  <div class="roof" aria-hidden="true"></div>
  <div class="board"><small>MAMALEN TAMU!</small><div class="plaque"><h1>Tindahan ning Kultura</h1><p>Kapampangan Sari-Sari Store &middot; Explore the culture of Pampanga</p></div></div>
  <div class="awning" aria-hidden="true"></div>
  <div class="hang" id="hang" aria-hidden="true"></div>
  <div class="win" id="win" aria-hidden="true">
    <div class="dot a">LOAD<br>DITO</div><div class="dot b">&#8369;5<br>LANG</div>
    <div class="utang">BAWAL UTANG!</div>
  </div>
</header>
<main>
  <div class="bubble" id="bubble">Pabili poooo~</div>
  <div class="scene" id="scene">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flip the card">
      <div class="face back"><b>?</b><span>TAP TO FLIP!</span></div>
      <div class="face front" aria-live="polite">
        <div class="price">&#8369;5 lang!</div>
        <div class="cat tt" id="cat"></div>
        <div class="q" id="q"></div>
        <button id="reveal" type="button">Reveal Answer</button>
        <div class="a" id="a"><small id="alabel"></small><span id="atext"></span></div>
      </div>
    </div>
  </div>
  <button id="shuffle" type="button" aria-label="Shuffle to a new card"><span aria-hidden="true">&#128256;</span> SHUFFLE</button>
</main>
<div class="counter" aria-hidden="true"><span>&#129769;</span><span>&#129370;</span><span>&#129372;</span><span>&#127850;</span><span>&#129370;</span><span>&#129769;</span><p>Pamanuli king kulturang Kapampangan! &#127982; Pampanga</p></div>
<script>
// Source: Bigkasin_Games.pdf. Each item is [text, translation/answer].
const TWISTERS=[
["KAKANGKANG KANG KAKANGKANG","You nag too much"],
["KUKUKU KUNG KUKUKU","I cough a lot"],
["TANG ‘TIN TANG TUN?","Father, do we have rice?"],
["E KA MAGBOMBA KABANG MAMOMBA KU KENG BOMBA","do not undress while I draw water from the pump"],
["TA’T TATATAKIKI YA’Y TATA TA","why does our father keep tagging along?"],
["TANG! TUTU TANG, TUTUTU KU TANG!","Tatay totoo po, Totoo po sinasabi ko!"],
["KINAYI NENG KAYI I KAYI KETANG KAYI ANYANG KAYI","someone did something to someone somewhere sometime ago"],
["NA’NG NANANGNANG NANG ‘NANG?","What’s mother grilling?"],
["KUKUA KUNG KUKUANG KUA","i get puppies a lot"],
["Kikiak ya i Kiko keng kuku na.","Kiko is crying because of his fingernail."],
["Kakatak ya ing katak king taktak.","The toad is croaking loudly in the mud"],
["Tutuki ka pa ba keng tutuki?","Are you still tagging along next time?"],
["Ninu ing ninang nang Nene","Who is Nene's godmother?"],
["‘TSE, ‘TSU ‘TSI MO?","Ate, andiyan ba ate mo?"],
["Milulan la reng lulanan king lulanan.","The containers were loaded into the cargo space"],
["TANG, ‘TIN TANG TUN","Father, do we have cooked rice?"],
["Lalam malam, malalam","Deep night, it is very deep."],
["Pepapapakan neng Papa ing pusa.","Papa fed the cat."],
["Salasala ya ing sasala king sala.","The light filtering through the living room is messy."],
["Atin yang tina i Tina king tina.","Tina has dye on her clothes."],
["I APU MU I APU KU","Lola mo ang lola ko"],
["Ating atlung asu king atlung bale.","There are three dogs in three houses."],
["Mangaral ya ing mangaral a mangaral.","The student keeps on studying."],
["Mekatuknang ya Tino king tuknangan ning Tita.","Umupo si Tino sa upuan ni Tita."],
["Mekasakit ya Sakit, masakit ya Sakit king sakit.","Nasaktan si Sakit, masakit ang kanyang sakit."],
["Susi ning Sisa, sisi ning Siso, susi-sisi ya Sisa king sisi ning Siso.","Susi ni Sisa, sisi ni Siso, sinisisi ni Sisa ang sisi ni Siso."],
["Maragul a maragul ing maragul a bale.","The big house is really big."],
["Miyabe ya Mando king Minda, miyabe ya Minda king Mando, miyabe la king bale.","Sumama si Mando kay Minda, sumama si Minda kay Mando, magkasama sila sa bahay."],
["Mikagat ing pusa king pusa, pusa king pusa, pusa-pusang mikagat.","Kumagat ang pusa sa pusa, pusa sa pusa, mga pusang nagkakagatan."],
["Pitung pusa king pitung bale mamangan pitung pinggan.","Seven cats in seven houses eat seven plates."],
["Mangan ya Mang Mando ning mangga, mangga ning Mando ing minangan ning mangangan.","Kumain si Mang Mando ng mangga, mangga ni Mando ang kinain ng mga kumakain."],
["Mikuskus ya Kiko king kusina ning Kaka, mikuskus ya Kaka king kusina ning Kiko.","Nagkuskos si Kiko sa kusina ni Kuya, nagkuskos si Kuya sa kusina ni Kiko."],
["Ating asu king aslag ning aldo, asung asul king aslag ning aldo, aslag ning aldo ing aslag ning asu.","May aso sa sikat ng araw, may asul na aso sa sikat ng araw, sikat ng araw ang tumatama sa aso."],
["Kapampangan ku, Kapampangan mu, Kapampangan tamu.","My Kapampangan, your Kapampangan, our Kapampangan."]
];
const TRIVIA=[
["Who is known as the “Father of Kapampangan Literature”?","Juan Crisostomo Soto"],
["What is kamaru?","Mole cricket, cooked adobo-style."],
["What natural material buried parts of Pampanga after Pinatubo?","Lahar."],
["When is Pampanga Day celebrated?","December 11."],
["What is the name of the historic town in Pampanga famous for its heritage church and traditional cuisine?","Guagua"],
["What is the famous mountain in Pampanga, said to be home to Mariang Sinukuan?","Mount Arayat."],
["What is a common ingredient used in many Kapampangan dishes to add flavor?","Garlic"],
["Which region is Pampanga in?","Central Luzon (Region III)."],
["What is the name of the historic church in Betis, Guagua, famous for its elaborate ceiling paintings?","Betis Church"],
["What is the name of the famous Kapampangan sweet rice cake made with milk and topped with latik?","Tibok-tibok"],
["What is the traditional Kapampangan dish made with rice, chicken, and coconut milk, often served during celebrations?","Bringhe"],
["What is the name of the famous historical house in San Fernando associated with the Philippine Revolution and Emilio Aguinaldo's era?","Pamintuan Mansion"],
["What traditional Filipino religious play reenacts the Passion of Christ?","Senakulo"],
["What is the name of the historic church in Bacolor that was partly buried by lahar?","San Guillermo Parish Church"],
["What traditional Christmas decoration is famous in Pampanga?","Parol"],
["What is Pampanga popularly known for in terms of food?","Culinary Capital"],
["What famous Kapampangan delicacy is made from glutinous rice and coconut milk?","Suman"],
["What is the name of the annual lantern festival in San Fernando?","Ligligan Parul"],
["What is the name of the traditional Filipino religious practice of visiting churches during Holy Week?","Visita Iglesia"],
["What city in Pampanga is home to Clark Freeport Zone?","Mabalacat"],
["Which volcano erupted in 1991 and affected Pampanga?","Mount Pinatubo."],
["What famous Kapampangan delicacy is made from ground peanuts and sugar?","Mazapan"],
["What is the name of the Kapampangan dish made from marinated carabao meat?","Pindang damulag"],
["How many cities does Pampanga have?","3"],
["Which city is nicknamed the “Sisig Capital”?","Angeles City."],
["What is the name of the famous Kapampangan sweet made with cashew nuts?","Turrones de casuy"],
["Who is credited with inventing modern sisig in Angeles?","Lucing Cunanan (“Aling Lucing”)."],
["What traditional Kapampangan dish is made with pork, vinegar, and spices?","Kilayin"],
["What is the name of the famous church in Angeles City known as Pisamban Maragul?","Holy Rosary"],
["What is the old Kapampangan script called?","Kulitan."],
["What is the song Atin cu pung singsing about?","A woman who has a ring and lost it."],
["In what barangay are the famous Good Friday crucifixion rites held in San Fernando?","Cutud."],
["What Pampanga town celebrates the Duman Festival?","Santa Rita."],
["What festival in Angeles City combines music and street performances?","Tigtigan Terakan"]
];
const CATS=[
 {label:"TONGUE TWISTER",cls:"tt",items:TWISTERS,ans:"TRANSLATION",btn:"Reveal Translation"},
 {label:"PAMPANGA TRIVIA",cls:"tv",items:TRIVIA,ans:"ANSWER",btn:"Reveal Answer"}
];
const $=id=>document.getElementById(id);
const COLORS=["#e63946","#2a9d8f","#f4a261","#457b9d","#ffd23f","#9b5de5","#e63946","#2a9d8f"];
COLORS.forEach((c,i)=>{
  const s=document.createElement("span");s.className="sachet";s.style.setProperty("--c",c);s.style.animationDelay=(i*.3)+"s";$("hang").appendChild(s);
  if(i%3===1){const b=document.createElement("span");b.className="ban";b.textContent="\u{1F34C}";$("hang").appendChild(b)}
});
["\u{1F36B}\u{1F36C}\u{1F96B}\u{1F36A}\u{1F95C}\u{1F9C3}","\u{1F37E}\u{1F964}\u{1F9C3}\u{1F96B}\u{1F35C}\u{1F36D}","\u{1F37F}\u{1F954}\u{1F358}\u{1F359}\u{1F95A}\u{1F9C2}"].forEach(t=>{
  const p=document.createElement("div");p.className="pane";p.innerHTML=Array.from(t).map(e=>"<span>"+e+"</span>").join("");$("win").insertBefore(p,$("win").querySelector(".utang"));
});
const LINES=["Pabili poooo~","Magkano po?","Ate, isa nga po!","Pabili ng kultura!","Tatlong potchi nga po~","Ano ang laro ngayon?"];
let last=null,timer=0;
function load(c,i){
  const it=c.items[i];
  $("cat").textContent=c.label;$("cat").className="cat "+c.cls;
  $("q").textContent=it[0];
  $("alabel").textContent=c.ans;
  $("atext").textContent=it[1]||"(not provided)";
  $("a").classList.remove("show");
  $("reveal").textContent=c.btn;$("reveal").hidden=false;
  last=c.cls+i;
}
function shuffle(){
  const ok=CATS.filter(c=>c.items.length);
  if(!ok.length){$("q").textContent="No cards available.";return}
  let c,i,n=0;
  do{c=ok[Math.floor(Math.random()*ok.length)];i=Math.floor(Math.random()*c.items.length)}while(c.cls+i===last&&++n<50);
  const card=$("card"),was=card.classList.contains("flipped");
  clearTimeout(timer);
  card.classList.remove("flipped");
  const s=$("scene");s.classList.remove("deal");void s.offsetWidth;s.classList.add("deal");
  $("bubble").textContent=LINES[Math.floor(Math.random()*LINES.length)];
  if(was)timer=setTimeout(()=>load(c,i),350);else load(c,i);
}
function reveal(){$("a").classList.add("show");$("reveal").hidden=true}
function flip(){const card=$("card");if(card.classList.contains("flipped"))reveal();else card.classList.add("flipped")}
$("shuffle").addEventListener("click",()=>{const b=$("shuffle");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");shuffle()});
$("reveal").addEventListener("click",e=>{e.stopPropagation();reveal()});
$("card").addEventListener("click",flip);
$("card").addEventListener("keydown",e=>{if(e.target===$("card")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();flip()}});
shuffle();
</script>
</body>
</html>
